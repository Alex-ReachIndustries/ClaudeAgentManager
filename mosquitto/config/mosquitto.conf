# Mosquitto MQTT Broker Configuration
# ClaudeManager agent communication

# Listener for MQTT (plain TCP)
listener 1883
protocol mqtt

# Listener for MQTT over WebSocket (for dashboard)
listener 9001
protocol websockets

# Authentication
allow_anonymous false
password_file /mosquitto/config/passwd

# Persistence
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest stdout
log_type error
log_type warning
log_type notice

# Connection limits
max_connections -1
max_queued_messages 1000
