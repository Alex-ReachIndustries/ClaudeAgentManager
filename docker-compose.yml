services:
  backend:
    build: ./backend
    ports:
      - "3001:3001"
    volumes:
      - ${HOST_DATA_PATH:-/ClaudeManager/agent-data}:/app/data
      - ${HOST_HOME_PATH}:/host-home:ro
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      - PORT=3001
      - DB_PATH=/app/data/agents.db
      - PDF_SERVICE_URL=http://pdf-generator:8090
      - HOST_HOME_MOUNT=/host-home
      - KB_MODEL_CACHE=/app/data/hf-cache
      - KB_CAT_THRESHOLD=0.52
      - KB_CAT_MAXPER=3
      - AUTH_ENABLED=true
      - API_KEY=${API_KEY:-}
      - MQTT_URL=mqtt://mqtt:1883
      - MQTT_USERNAME=backend
      - MQTT_PASSWORD=${MQTT_BACKEND_PASSWORD:-claudemanager}
    depends_on:
      mqtt:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
    stop_grace_period: 30s
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
    restart: unless-stopped

  mqtt:
    build: ./mosquitto
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - mqtt-data:/mosquitto/data
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
    environment:
      - MQTT_BACKEND_PASSWORD=${MQTT_BACKEND_PASSWORD:-claudemanager}
      - MQTT_AGENT_PASSWORD=${MQTT_AGENT_PASSWORD:-agentsidecar}
      - MQTT_DASHBOARD_PASSWORD=${MQTT_DASHBOARD_PASSWORD:-dashboard}
    restart: unless-stopped

  pdf-generator:
    build: ./printingpress-api
    volumes:
      - ${PRINTINGPRESS_PATH}:/app
      - ${PRINTINGPRESS_PATH}/api_wrapper.py:/app/api_wrapper.py
    restart: unless-stopped

volumes:
  mqtt-data:
